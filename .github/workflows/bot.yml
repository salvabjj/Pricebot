name: Executar Pricebot 5.1

on:
  schedule:
    # 09h até 21h Brasil (12h até 00h UTC)
    - cron: '0 12-23 * * *'
    # 22h Brasil (01h UTC)
    - cron: '0 1 * * *'
  workflow_dispatch:

jobs:
  executar-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Executar Bot
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python Bot.py
